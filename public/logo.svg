<svg xmlns="http://www.w3.org/2000/svg" width="360" height="88" viewBox="0 0 360 88" role="img" aria-label="City Sightseeing Dublin">
  <!-- Bus badge -->
  <g>
    <rect x="4" y="14" width="60" height="60" rx="14" fill="#D6001C"/>
    <!-- bus body -->
    <rect x="14" y="30" width="40" height="22" rx="4" fill="#ffffff"/>
    <!-- windows -->
    <rect x="18" y="34" width="7" height="7" rx="1.5" fill="#D6001C"/>
    <rect x="28" y="34" width="7" height="7" rx="1.5" fill="#D6001C"/>
    <rect x="38" y="34" width="7" height="7" rx="1.5" fill="#D6001C"/>
    <!-- open top passengers -->
    <circle cx="22" cy="27" r="3" fill="#ffffff"/>
    <circle cx="34" cy="27" r="3" fill="#ffffff"/>
    <circle cx="46" cy="27" r="3" fill="#ffffff"/>
    <!-- wheels -->
    <circle cx="24" cy="54" r="5.5" fill="#ffffff"/>
    <circle cx="24" cy="54" r="2.5" fill="#D6001C"/>
    <circle cx="44" cy="54" r="5.5" fill="#ffffff"/>
    <circle cx="44" cy="54" r="2.5" fill="#D6001C"/>
  </g>
  <!-- Wordmark -->
  <text x="76" y="44" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="30" fill="#D6001C">City Sightseeing</text>
  <text x="78" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" letter-spacing="7" fill="#1a1a1a">DUBLIN</text>
</svg>
